<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Ventas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121014;
  --surface:#1b181d;
  --surface-2:#221f25;
  --line:#332e35;
  --text:#ede7e0;
  --muted:#948c95;
  --accent:#a8394a;
  --accent-soft:#3a2027;
  --belgrano:#6f9377;
  --belgrano-bg:#1f2b22;
  --cc:#5b83a3;
  --cc-bg:#1c2731;
  --salda:#c39355;
  --salda-bg:#2c2419;
  --debt:#c25c5c;
  --paid:#7ea583;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
h1,h2,h3,.brand{font-family:'Fraunces',serif;}

header{
  position:sticky;top:0;z-index:20;
  background:rgba(18,16,20,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;
}
.brand{font-size:19px;font-weight:600;letter-spacing:.3px;font-style:italic;}
.brand span{color:var(--accent);}
nav{display:flex;gap:6px;}
nav button{
  background:none;border:none;color:var(--muted);font-family:'Inter';font-size:13.5px;font-weight:600;
  padding:9px 15px;border-radius:8px;cursor:pointer;letter-spacing:.2px;transition:.15s;
}
nav button:hover{color:var(--text);background:var(--surface-2);}
nav button.active{color:var(--text);background:var(--accent-soft);}

main{padding:26px 22px 100px;max-width:1500px;margin:0 auto;}
.view{display:none;}
.view.active{display:block;}
.view-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.view-head h1{font-size:26px;font-weight:600;font-style:italic;margin:0;}
.view-head .count{color:var(--muted);font-size:13px;}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);}
table{border-collapse:collapse;width:100%;min-width:1180px;font-size:13px;}
thead th{
  text-align:left;padding:11px 12px;background:var(--surface-2);color:var(--muted);
  font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;
}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap;}
tbody td.wrap{white-space:normal;min-width:200px;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,.015);}
.cliente-name{font-weight:600;}
.cod{color:var(--muted);font-variant-numeric:tabular-nums;}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.badge.belgrano{background:var(--belgrano-bg);color:var(--belgrano);}
.badge.cc{background:var(--cc-bg);color:var(--cc);}
.badge.salda{background:var(--salda-bg);color:var(--salda);}
.money{font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);}
.debe-cell{cursor:pointer;font-weight:700;color:var(--debt);border-radius:6px;padding:4px 8px;transition:.15s;}
.debe-cell:hover{background:rgba(194,92,92,.12);}
.debe-cell.paid{color:var(--paid);cursor:default;font-weight:600;}
.debe-cell.paid:hover{background:none;}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);}
.empty-state .big{font-family:'Fraunces';font-style:italic;font-size:20px;color:var(--text);margin-bottom:6px;}

/* deudas view */
.deuda-card{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:14px 18px;margin-bottom:8px;
}
.deuda-card .left{display:flex;flex-direction:column;gap:3px;}
.deuda-card .left .name{font-weight:600;font-size:15px;}
.deuda-card .left .date{font-size:12px;color:var(--muted);}
.deuda-card .amount{font-weight:700;color:var(--debt);font-size:16px;font-variant-numeric:tabular-nums;}

/* fab */
.fab{
  position:fixed;right:26px;bottom:26px;width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;font-size:28px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 26px rgba(168,57,74,.45);z-index:30;transition:.2s;
  font-family:'Fraunces';font-weight:500;
}
.fab:hover{transform:scale(1.06);box-shadow:0 10px 32px rgba(168,57,74,.6);}

/* modal */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(10,9,11,.72);backdrop-filter:blur(3px);
  z-index:50;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;
}
.overlay.active{display:flex;}
.modal{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  width:100%;max-width:640px;padding:26px 26px 22px;
}
.modal h2{font-size:21px;font-weight:600;font-style:italic;margin:0 0 4px;}
.modal .sub{color:var(--muted);font-size:12.5px;margin-bottom:20px;}
.field-group{margin-bottom:16px;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}
label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:6px;}
input,select{
  width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  padding:10px 12px;border-radius:8px;font-size:14px;font-family:'Inter';outline:none;transition:.15s;
}
input:focus,select:focus{border-color:var(--accent);}
input::placeholder{color:#5c5560;}
.section-label{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;}
.line-item{
  display:grid;grid-template-columns:2fr 0.7fr 1fr auto auto;gap:8px;margin-bottom:8px;align-items:end;
}
.line-item.pago{grid-template-columns:1.4fr 1fr auto;}
.mini-label{font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;}
.icon-btn{
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);width:36px;height:36px;
  border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{color:var(--text);border-color:var(--accent);}
.add-line{
  background:none;border:1px dashed var(--line);color:var(--muted);padding:8px 14px;border-radius:8px;
  cursor:pointer;font-size:12.5px;font-weight:600;width:100%;margin-top:2px;
}
.add-line:hover{border-color:var(--accent);color:var(--accent);}
.modal-actions{display:flex;gap:10px;margin-top:24px;}
.btn{
  padding:11px 20px;border-radius:9px;border:none;font-weight:700;font-size:13.5px;cursor:pointer;
  font-family:'Inter';letter-spacing:.2px;
}
.btn-primary{background:var(--accent);color:#fff;flex:1;}
.btn-primary:hover{background:#b8455a;}
.btn-ghost{background:var(--surface-2);color:var(--muted);border:1px solid var(--line);}
.btn-ghost:hover{color:var(--text);}
.totals-preview{
  background:var(--surface-2);border-radius:10px;padding:12px 16px;margin-top:14px;
  display:flex;justify-content:space-between;font-size:13px;flex-wrap:wrap;gap:8px;
}
.totals-preview b{color:var(--text);}

/* debe popover */
.pop-overlay{display:none;position:fixed;inset:0;z-index:60;align-items:center;justify-content:center;background:rgba(10,9,11,.6);}
.pop-overlay.active{display:flex;}
.pop{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;width:280px;}
.pop h3{margin:0 0 4px;font-size:16px;font-style:italic;}
.pop .sub{color:var(--muted);font-size:12px;margin-bottom:16px;}

@media(max-width:640px){
  header{padding:12px 14px;}
  nav button{padding:8px 10px;font-size:12.5px;}
  main{padding:18px 12px 100px;}
  .line-item{grid-template-columns:1fr 1fr;grid-auto-flow:row;}
  .line-item.pago{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<header>
  <div class="brand">Registro<span>.</span></div>
  <nav>
    <button class="nav-btn active" data-view="ventas">Ventas</button>
    <button class="nav-btn" data-view="deudas">Deudas</button>
    <button class="nav-btn" id="navNueva">+ Nueva venta</button>
  </nav>
</header>

<main>

  <section id="view-ventas" class="view active">
    <div class="view-head">
      <h1>Ventas</h1>
      <div class="count" id="ventasCount"></div>
    </div>
    <div class="table-wrap">
      <table id="ventasTable">
        <thead>
          <tr>
            <th>Cód.</th><th>Clienta</th><th>Fecha compra</th><th>Punto de venta</th><th>Fecha evento</th>
            <th>Producto</th><th>Cant</th><th>Valor unit.</th><th>Total $</th><th>Total usd</th>
            <th>Efectivo</th><th>Efvo usd</th><th>Transf. BF</th><th>Transf. VF</th><th>Tarjeta</th>
            <th>DEBE</th><th>DNI</th><th>Fact.</th><th>Cel</th>
          </tr>
        </thead>
        <tbody id="ventasBody"></tbody>
      </table>
    </div>
  </section>

  <section id="view-deudas" class="view">
    <div class="view-head">
      <h1>Deudas</h1>
      <div class="count" id="deudasCount"></div>
    </div>
    <div id="deudasList"></div>
  </section>

</main>

<button class="fab" id="fabAdd" title="Nueva venta">+</button>

<!-- MODAL NUEVA VENTA -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Nueva venta</h2>
    <div class="sub">Cargá los datos de la clienta y el detalle de la compra</div>
    <form id="ventaForm">

      <div class="field-row">
        <div class="field field-group">
          <label>Código</label>
          <input type="text" id="fCod" placeholder="ej: 0701">
        </div>
        <div class="field field-group">
          <label>Fecha de compra</label>
          <input type="date" id="fFecha" required>
        </div>
        <div class="field field-group">
          <label>Fecha de evento</label>
          <input type="text" id="fFechaEvento" placeholder="ej: 15/08 o septiembre">
        </div>
      </div>

      <div class="field-group">
        <label>Nombre de la clienta</label>
        <input type="text" id="fCliente" required placeholder="Nombre y apellido">
      </div>

      <div class="field-row">
        <div class="field field-group">
          <label>DNI</label>
          <input type="text" id="fDni" placeholder="opcional">
        </div>
        <div class="field field-group">
          <label>Celular</label>
          <input type="text" id="fCel" placeholder="opcional">
        </div>
      </div>

      <div class="field-row">
        <div class="field field-group">
          <label>Punto de venta</label>
          <select id="fPunto">
            <option value="Belgrano">Belgrano</option>
            <option value="CC">CC</option>
            <option value="Salda Cta Cte">Salda Cta Cte</option>
          </select>
        </div>
        <div class="field field-group">
          <label>Nº Factura</label>
          <input type="text" id="fFactura" placeholder="opcional">
        </div>
      </div>

      <div id="productosSection">
        <div class="section-label">Productos</div>
        <div id="productosList"></div>
        <button type="button" class="add-line" id="addProducto">+ Agregar producto</button>
      </div>

      <div id="detalleSaldaField" class="field-group" style="display:none;">
        <label>Detalle</label>
        <input type="text" id="fDetalleSalda" placeholder="ej: salda deuda de julio">
      </div>

      <div class="field-group">
        <label>Detalle</label>
        <input type="text" id="fDetalle" placeholder="Notas u observaciones sobre la venta (opcional)">
      </div>

      <div class="section-label">Métodos de pago</div>
      <div id="pagosList"></div>
      <button type="button" class="add-line" id="addPago">+ Agregar método de pago</button>

      <div class="totals-preview" id="totalsPreview"></div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar venta</button>
      </div>
    </form>
  </div>
</div>

<!-- POPOVER DEBE -->
<div class="pop-overlay" id="popOverlay">
  <div class="pop">
    <h3 id="popCliente"></h3>
    <div class="sub" id="popMonto"></div>
    <div class="field-group">
      <label>Fecha de pago</label>
      <input type="date" id="popFecha">
    </div>
    <div class="modal-actions" style="margin-top:14px;">
      <button class="btn btn-ghost" id="popCancel">Cerrar</button>
      <button class="btn btn-primary" id="popConfirm">Marcar PAGÓ</button>
    </div>
    <button class="btn btn-ghost" id="popRevert" style="width:100%;margin-top:8px;display:none;">Revertir a pendiente</button>
  </div>
</div>

<script>
const LS_KEY = 'registroVentasDB_v1';
let ventas = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
const PAGO_TIPOS = ['Efectivo','Efvo usd','Transf. BF','Transf. VF','Tarjeta'];
const PAGO_COLS  = {'Efectivo':'Efectivo','Efvo usd':'Efvo usd','Transf. BF':'Transf. BF','Transf. VF':'Transf. VF','Tarjeta':'Tarjeta'};

function save(){ localStorage.setItem(LS_KEY, JSON.stringify(ventas)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){ return '$ ' + Math.round(n).toLocaleString('es-AR'); }
function fmtUsd(n){ return 'usd ' + Math.round(n).toLocaleString('es-AR'); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}`; }

// ---------- NAV ----------
document.querySelectorAll('.nav-btn').forEach(b=>{
  b.addEventListener('click', ()=>{
    if(b.id==='navNueva'){ openModal(); return; }
    document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+b.dataset.view).classList.add('active');
    if(b.dataset.view==='deudas') renderDeudas();
  });
});
document.getElementById('fabAdd').addEventListener('click', openModal);

// ---------- MODAL ----------
const overlay = document.getElementById('overlay');
function openModal(){
  document.getElementById('ventaForm').reset();
  document.getElementById('fFecha').value = new Date().toISOString().slice(0,10);
  document.getElementById('productosList').innerHTML='';
  document.getElementById('pagosList').innerHTML='';
  addProductoLine();
  addPagoLine();
  updateTotalsPreview();
  togglePuntoFields();
  overlay.classList.add('active');
}
document.getElementById('cancelBtn').addEventListener('click', ()=>overlay.classList.remove('active'));
overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.classList.remove('active'); });
document.getElementById('fPunto').addEventListener('change', togglePuntoFields);

function togglePuntoFields(){
  const isSalda = document.getElementById('fPunto').value === 'Salda Cta Cte';
  document.getElementById('productosSection').style.display = isSalda ? 'none' : 'block';
  document.getElementById('detalleSaldaField').style.display = isSalda ? 'block' : 'none';
}

function addProductoLine(){
  const wrap = document.createElement('div');
  wrap.className = 'line-item producto-line';
  wrap.innerHTML = `
    <div><div class="mini-label">Producto</div><input type="text" class="p-nombre" placeholder="Descripción"></div>
    <div><div class="mini-label">Cant</div><input type="number" class="p-cant" value="1" min="1"></div>
    <div><div class="mini-label">Valor unit.</div><input type="number" class="p-valor" placeholder="0"></div>
    <div><div class="mini-label">Moneda</div>
      <select class="p-moneda"><option value="ARS">$</option><option value="USD">usd</option></select>
    </div>
    <button type="button" class="icon-btn remove-line">×</button>`;
  wrap.querySelectorAll('input,select').forEach(el=>el.addEventListener('input', updateTotalsPreview));
  wrap.querySelector('.remove-line').addEventListener('click', ()=>{ wrap.remove(); updateTotalsPreview(); });
  document.getElementById('productosList').appendChild(wrap);
}
document.getElementById('addProducto').addEventListener('click', addProductoLine);

function addPagoLine(){
  const wrap = document.createElement('div');
  wrap.className = 'line-item pago pago-line';
  wrap.innerHTML = `
    <div><div class="mini-label">Método</div>
      <select class="pg-tipo">${PAGO_TIPOS.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
    </div>
    <div><div class="mini-label">Monto</div><input type="number" class="pg-monto" placeholder="0"></div>
    <button type="button" class="icon-btn remove-line">×</button>`;
  wrap.querySelectorAll('input,select').forEach(el=>el.addEventListener('input', updateTotalsPreview));
  wrap.querySelector('.remove-line').addEventListener('click', ()=>{ wrap.remove(); updateTotalsPreview(); });
  document.getElementById('pagosList').appendChild(wrap);
}
document.getElementById('addPago').addEventListener('click', addPagoLine);

function readProductos(){
  return [...document.querySelectorAll('.producto-line')].map(l=>({
    nombre: l.querySelector('.p-nombre').value.trim(),
    cant: parseFloat(l.querySelector('.p-cant').value)||0,
    valor: parseFloat(l.querySelector('.p-valor').value)||0,
    moneda: l.querySelector('.p-moneda').value
  })).filter(p=>p.nombre);
}
function readPagos(){
  return [...document.querySelectorAll('.pago-line')].map(l=>({
    tipo: l.querySelector('.pg-tipo').value,
    monto: parseFloat(l.querySelector('.pg-monto').value)||0
  })).filter(p=>p.monto>0);
}

function computeTotals(productos, pagos){
  let totalARS=0, totalUSD=0;
  productos.forEach(p=>{ const sub=p.cant*p.valor; if(p.moneda==='USD') totalUSD+=sub; else totalARS+=sub; });
  const paid = {}; PAGO_TIPOS.forEach(t=>paid[t]=0);
  pagos.forEach(p=>{ paid[p.tipo]+=p.monto; });
  const paidARS = paid['Efectivo']+paid['Transf. BF']+paid['Transf. VF']+paid['Tarjeta'];
  const paidUSD = paid['Efvo usd'];
  const debeARS = Math.max(0, Math.round((totalARS-paidARS)*100)/100);
  const debeUSD = Math.max(0, Math.round((totalUSD-paidUSD)*100)/100);
  return {totalARS,totalUSD,paid,debeARS,debeUSD};
}

function updateTotalsPreview(){
  const isSalda = document.getElementById('fPunto').value === 'Salda Cta Cte';
  const productos = isSalda ? [] : readProductos();
  const pagos = readPagos();
  const t = computeTotals(productos,pagos);
  let html = '';
  if(!isSalda){
    html += `<span>Total: <b>${fmt(t.totalARS)}</b>${t.totalUSD?` / <b>${fmtUsd(t.totalUSD)}</b>`:''}</span>`;
  }
  const debeTxt = [t.debeARS>0?fmt(t.debeARS):null, t.debeUSD>0?fmtUsd(t.debeUSD):null].filter(Boolean).join(' + ');
  html += `<span>Debe: <b>${debeTxt || '—'}</b></span>`;
  document.getElementById('totalsPreview').innerHTML = html;
}

// ---------- SUBMIT ----------
document.getElementById('ventaForm').addEventListener('submit', e=>{
  e.preventDefault();
  const punto = document.getElementById('fPunto').value;
  const isSalda = punto === 'Salda Cta Cte';
  const productos = isSalda
    ? [{nombre: document.getElementById('fDetalleSalda').value.trim() || 'salda deuda', cant:null, valor:null, moneda:'ARS'}]
    : readProductos();
  const pagos = readPagos();
  const t = computeTotals(isSalda?[]:productos, pagos);

  const fecha = document.getElementById('fFecha').value;
  const codInput = document.getElementById('fCod').value.trim();
  const cod = codInput || (isSalda ? '-' : '');

  ventas.push({
    id: uid(),
    cod, cliente: document.getElementById('fCliente').value.trim(),
    fecha, fechaEvento: document.getElementById('fFechaEvento').value.trim(),
    dni: document.getElementById('fDni').value.trim(),
    cel: document.getElementById('fCel').value.trim(),
    factura: document.getElementById('fFactura').value.trim(),
    detalle: document.getElementById('fDetalle').value.trim(),
    punto, productos, pagos,
    totalARS:t.totalARS, totalUSD:t.totalUSD, paid:t.paid,
    debeARS:t.debeARS, debeUSD:t.debeUSD,
    pagado:false, fechaPago:null
  });
  save();
  overlay.classList.remove('active');
  renderVentas();
});

// ---------- RENDER VENTAS ----------
function renderVentas(){
  const body = document.getElementById('ventasBody');
  body.innerHTML = '';
  const sorted = [...ventas].sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||''));
  document.getElementById('ventasCount').textContent = sorted.length ? `${sorted.length} registros` : '';

  if(!sorted.length){
    body.innerHTML = `<tr><td colspan="19"><div class="empty-state"><div class="big">Todavía no hay ventas cargadas</div>Tocá el botón + para agregar la primera</div></td></tr>`;
    return;
  }

  sorted.forEach(v=>{
    const rows = v.productos.length ? v.productos : [{nombre:'',cant:null,valor:null,moneda:'ARS'}];
    rows.forEach((p,i)=>{
      const tr = document.createElement('tr');
      const badgeClass = v.punto==='Belgrano'?'belgrano':v.punto==='CC'?'cc':'salda';
      let identityCells = '';
      if(i===0){
        identityCells = `
          <td rowspan="${rows.length}" class="cod">${v.cod}</td>
          <td rowspan="${rows.length}" class="cliente-name">${esc(v.cliente)}</td>
          <td rowspan="${rows.length}">${fmtDate(v.fecha)}</td>
          <td rowspan="${rows.length}"><span class="badge ${badgeClass}">${v.punto}</span></td>
          <td rowspan="${rows.length}">${esc(v.fechaEvento)||''}</td>`;
      }
      const prodCells = `
        <td class="wrap">${esc(p.nombre)}</td>
        <td>${p.cant??''}</td>
        <td class="money">${p.valor?fmt(p.valor):''}</td>`;
      let payCells = '';
      if(i===0){
        payCells = `
          <td rowspan="${rows.length}" class="money">${v.totalARS?fmt(v.totalARS):''}</td>
          <td rowspan="${rows.length}" class="money">${v.totalUSD?fmtUsd(v.totalUSD):''}</td>
          <td rowspan="${rows.length}" class="money">${v.paid['Efectivo']?fmt(v.paid['Efectivo']):''}</td>
          <td rowspan="${rows.length}" class="money">${v.paid['Efvo usd']?fmtUsd(v.paid['Efvo usd']):''}</td>
          <td rowspan="${rows.length}" class="money">${v.paid['Transf. BF']?fmt(v.paid['Transf. BF']):''}</td>
          <td rowspan="${rows.length}" class="money">${v.paid['Transf. VF']?fmt(v.paid['Transf. VF']):''}</td>
          <td rowspan="${rows.length}" class="money">${v.paid['Tarjeta']?fmt(v.paid['Tarjeta']):''}</td>
          <td rowspan="${rows.length}">${debeCellHtml(v)}</td>
          <td rowspan="${rows.length}">${esc(v.dni)||''}</td>
          <td rowspan="${rows.length}">${esc(v.factura)||''}</td>
          <td rowspan="${rows.length}">${esc(v.cel)||''}</td>`;
      }
      tr.innerHTML = identityCells + prodCells + payCells;
      body.appendChild(tr);
    });
  });

  document.querySelectorAll('.debe-cell[data-id]').forEach(el=>{
    el.addEventListener('click', ()=> openDebePop(el.dataset.id));
  });
}

function debeCellHtml(v){
  const hasDebt = v.debeARS>0 || v.debeUSD>0;
  if(v.pagado){
    return `<div class="debe-cell paid">PAGÓ<br><span class="muted" style="font-weight:400;font-size:11px;">${fmtDate(v.fechaPago)}</span></div>`;
  }
  if(!hasDebt) return '';
  const txt = [v.debeARS>0?fmt(v.debeARS):null, v.debeUSD>0?fmtUsd(v.debeUSD):null].filter(Boolean).join('<br>');
  return `<div class="debe-cell" data-id="${v.id}">${txt}</div>`;
}

function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---------- DEBE POPOVER ----------
let currentDebeId = null;
function openDebePop(id){
  const v = ventas.find(x=>x.id===id);
  if(!v) return;
  currentDebeId = id;
  document.getElementById('popCliente').textContent = v.cliente;
  const txt = [v.debeARS>0?fmt(v.debeARS):null, v.debeUSD>0?fmtUsd(v.debeUSD):null].filter(Boolean).join(' + ');
  document.getElementById('popMonto').textContent = 'Debe ' + txt;
  document.getElementById('popFecha').value = new Date().toISOString().slice(0,10);
  document.getElementById('popRevert').style.display = v.pagado ? 'block' : 'none';
  document.getElementById('popOverlay').classList.add('active');
}
document.getElementById('popCancel').addEventListener('click', ()=>document.getElementById('popOverlay').classList.remove('active'));
document.getElementById('popOverlay').addEventListener('click', e=>{ if(e.target.id==='popOverlay') e.currentTarget.classList.remove('active'); });
document.getElementById('popConfirm').addEventListener('click', ()=>{
  const v = ventas.find(x=>x.id===currentDebeId);
  if(!v) return;
  v.pagado = true;
  v.fechaPago = document.getElementById('popFecha').value;
  save();
  document.getElementById('popOverlay').classList.remove('active');
  renderVentas();
});
document.getElementById('popRevert').addEventListener('click', ()=>{
  const v = ventas.find(x=>x.id===currentDebeId);
  if(!v) return;
  v.pagado = false; v.fechaPago = null;
  save();
  document.getElementById('popOverlay').classList.remove('active');
  renderVentas();
});

// ---------- RENDER DEUDAS ----------
function renderDeudas(){
  const list = document.getElementById('deudasList');
  const pendientes = ventas.filter(v=> !v.pagado && (v.debeARS>0 || v.debeUSD>0));
  document.getElementById('deudasCount').textContent = pendientes.length ? `${pendientes.length} clientas con saldo pendiente` : '';
  if(!pendientes.length){
    list.innerHTML = `<div class="empty-state"><div class="big">No hay deudas pendientes</div>Todas las clientas están al día</div>`;
    return;
  }
  list.innerHTML = pendientes.map(v=>{
    const txt = [v.debeARS>0?fmt(v.debeARS):null, v.debeUSD>0?fmtUsd(v.debeUSD):null].filter(Boolean).join(' + ');
    return `<div class="deuda-card">
      <div class="left"><div class="name">${esc(v.cliente)}</div><div class="date">Compra del ${fmtDate(v.fecha)}</div></div>
      <div class="amount">${txt}</div>
    </div>`;
  }).join('');
}

renderVentas();
</script>
</body>
</html>
